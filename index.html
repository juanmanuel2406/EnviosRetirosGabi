<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Envíos Gabi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Turnero interno de envíos, expresos y retiros en depósito.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<script>
  /* Tema antes de pintar: evita el parpadeo claro/oscuro */
  try{var t=localStorage.getItem('envios-gabi-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Martian+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="topbar">
  <div class="tb-in">
    <a class="brand" href="#" aria-label="Envíos Gabi">
      <img src="assets/logo.svg" alt="" width="30" height="30">
      <span>Envíos <b>Gabi</b></span>
    </a>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="envio" aria-selected="true">Envíos / Expresos <span class="n" id="n-envio">0</span></button>
      <button class="tab" role="tab" data-tab="retiro" aria-selected="false">Retiro depósito <span class="n" id="n-retiro">0</span></button>
      <button class="tab" role="tab" data-tab="hist" aria-selected="false">Historial <span class="n" id="n-hist">0</span></button>
      <button class="tab" role="tab" data-tab="exp" aria-selected="false">Expresos <span class="n" id="n-exp">0</span></button>
      <span class="ink" id="ink" aria-hidden="true"></span>
    </nav>
    <div class="tb-r">
      <div class="mode" id="mode" hidden><span class="dot"></span>Modo Gabi<button type="button" id="mode-exit">Salir</button></div>
      <button type="button" class="icon-btn press" id="theme" aria-label="Cambiar a modo oscuro">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
      </button>
      <button type="button" class="btn press" id="btn-new" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nuevo pedido <span class="kbd">N</span>
      </button>
    </div>
  </div>
</header>

<main class="page">
  <section class="band" id="band">
    <div class="band-t">
      <h1 id="h1">Turnero envíos</h1>
      <p id="hsub"></p>
    </div>
    <ul class="legend" aria-label="Referencia de colores">
      <li><span class="sw tec"></span><b>Verde</b> pasó por técnica</li>
      <li><span class="sw stop"></span><b>Rojo</b> pedido frenado, no entregar</li>
      <li><span class="sw warn"></span><b>Amarillo</b> prestar atención</li>
    </ul>
  </section>

  <div class="bar">
    <div class="seg" id="seg" role="group" aria-label="Filtrar"></div>
    <div class="right">
      <div class="dots" id="dots" role="group" aria-label="Filtrar por color"></div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar cliente, venta, expreso" aria-label="Buscar"><span class="k">/</span>
      </label>
    </div>
  </div>

  <section class="sheet" id="sheet"></section>
  <p class="foot" id="foot"></p>
</main>

<div class="menu" id="menu" role="menu" data-state="closed" hidden></div>

<div class="scrim" id="scrim" data-state="closed"></div>
<aside class="drawer" id="drawer" data-state="closed" aria-labelledby="dr-title" aria-hidden="true">
  <form id="form" autocomplete="off">
    <div class="dr-h">
      <h2 id="dr-title">Nuevo pedido</h2>
      <button type="button" class="icon-btn" id="dr-x" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="dr-b">
      <div class="f"><span class="lab">Tipo</span>
        <div class="kseg" role="group" aria-label="Tipo de pedido">
          <button type="button" id="k-envio" data-kind="envio" aria-pressed="true">Envío / Expreso</button>
          <button type="button" id="k-retiro" data-kind="retiro" aria-pressed="false">Retiro depósito</button>
        </div>
      </div>
      <div class="f2">
        <div class="f"><label for="f-vend">Vendedor</label><select id="f-vend" class="in"><option>GK</option><option>Gabriel</option></select></div>
        <div class="f"><label for="f-venta">Venta SaaS (número o enlace)</label><input id="f-venta" class="in mono" type="text" placeholder="1444651 o enlace de la venta"></div>
      </div>
      <div class="f"><label for="f-cli">Cliente</label><input id="f-cli" class="in" placeholder="PERRICONE MARCELO EDUARDO"></div>
      <div class="f"><label for="f-com">Comentarios</label><textarea id="f-com" class="in" placeholder="Dirección, a quién dejarle, bultos, valor declarado…"></textarea></div>
      <div class="f"><label for="f-met">Método</label><select id="f-met" class="in"></select></div>
      <div class="sec" id="sec-envio">
        <div class="f2">
          <div class="f"><label for="f-ubic">Ubicación</label><input id="f-ubic" class="in" placeholder="Lanús Oeste"></div>
          <div class="f"><label for="f-tel">Teléfono</label><input id="f-tel" class="in mono" inputmode="tel" placeholder="11 2724-5552"></div>
        </div>
        <div class="f2">
          <div class="f"><label for="f-hor">Horario</label><input id="f-hor" class="in" placeholder="9:30 a 13 y 16 a 19"></div>
          <div class="f"><label for="f-monto">Valor ($)</label><input id="f-monto" class="in mono" inputmode="decimal" placeholder="150.000,50"></div>
        </div>
        <div class="f"><label for="f-exp">Expreso</label><input id="f-exp" class="in" list="dl-exp" placeholder="Elegí de la lista o escribí"><datalist id="dl-exp"></datalist>
          <div class="exinfo" id="exinfo" hidden></div>
        </div>
      </div>
      <div class="sec"><div class="f"><span class="lab">Color</span><div class="fpick" id="fpick"></div></div></div>
      <p class="err" id="f-err" role="alert" hidden>Falta el nombre del cliente.</p>
    </div>
    <div class="dr-f">
      <button type="button" class="danger" id="f-del" hidden>Eliminar</button><span></span>
      <div class="dr-act"><button type="button" class="btn-2 press" id="f-cancel">Cancelar</button><button type="submit" class="btn press" id="f-save">Cargar pedido</button></div>
    </div>
  </form>
</aside>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
